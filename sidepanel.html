<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>LeetCode Copilot</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="panel">
  <header>
    <div class="header-row">
      <h1 id="title"></h1>
      <button id="settings" class="btn btn-ghost btn-sm">设置</button>
    </div>
    <div class="meta">
      <span id="difficulty" class="badge" hidden></span>
      <span id="lang" class="badge badge-secondary" hidden></span>
    </div>
    <button id="retry" class="btn btn-outline btn-sm" hidden>重新读取</button>
  </header>
  <div class="tabs" role="tablist">
    <button id="tab-hints" class="tab" role="tab" aria-selected="true" aria-controls="hints">提示</button>
    <button id="tab-review" class="tab" role="tab" aria-selected="false" aria-controls="review">评估</button>
  </div>
  <section id="hints" role="tabpanel" aria-labelledby="tab-hints">
    <div class="toolbar">
      <button id="generate" class="btn btn-primary">生成提示</button>
      <button id="stop" class="btn btn-outline" hidden>停止</button>
    </div>
    <div id="status" class="status"></div>
    <div id="sections" class="accordion"></div>
  </section>
  <section id="review" role="tabpanel" aria-labelledby="tab-review" hidden>
    <div class="toolbar">
      <button id="evaluate" class="btn btn-primary">评估代码</button>
      <button id="stop-review" class="btn btn-outline" hidden>停止</button>
    </div>
    <div id="status-review" class="status"></div>
    <div id="sections-review" class="accordion"></div>
  </section>
  <script src="vendor/marked.min.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
