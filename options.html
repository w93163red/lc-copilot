<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>LeetCode Copilot 设置</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="options">
  <main>
    <div class="card">
      <div class="card-header">
        <h1 class="card-title">LeetCode Copilot 设置</h1>
        <p class="card-description">填写一个 OpenAI 兼容接口。设置只保存在本机的 chrome.storage.local。</p>
      </div>
      <div class="card-content">
        <div class="field">
          <label class="label" for="baseUrl">Base URL</label>
          <input id="baseUrl" class="input" type="url" placeholder="https://api.openai.com/v1" spellcheck="false">
          <p class="hint">OpenAI 兼容接口地址，不含 /chat/completions。</p>
        </div>
        <div class="field">
          <label class="label" for="apiKey">API Key</label>
          <input id="apiKey" class="input" type="password" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label class="label" for="model">模型</label>
          <input id="model" class="input" type="text" placeholder="gpt-4o-mini" spellcheck="false">
        </div>
        <div class="toolbar">
          <button id="save" class="btn btn-primary">保存</button>
          <button id="test" class="btn btn-outline">测试连接</button>
        </div>
        <div id="status" class="status"></div>
      </div>
    </div>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
